[package]
name = "btc-15min-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
# Polymarket SDK
polymarket-client-sdk = { path = "..", features = ["ws", "data"] }

# Async runtime
tokio = { version = "1.49", features = ["full"] }
futures = "0.3"

# Cryptography & Blockchain
alloy = { version = "1.2.1", features = ["signer-local"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Configuration
dotenv = "0.15"

# Time
chrono = "0.4"

# Decimal precision
rust_decimal = "1.33"
rust_decimal_macros = "1.33"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
